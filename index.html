<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Easy Paint</title>
  <style>
    :root {
      --bg-top: #fff6d8;
      --bg-bottom: #ffe4f2;
      --panel: #ffffff;
      --ink: #1f2430;
      --border: #d8dbe5;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --accent: #2d7cff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Avenir Next", "Nunito", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      padding: 12px;
    }

    .toolbar {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 10px;
      margin-right: 2px;
      border-right: 2px dashed #eceef5;
    }

    .group:last-child {
      border-right: none;
      padding-right: 0;
    }

    button {
      border: 2px solid transparent;
      border-radius: 12px;
      min-height: 46px;
      padding: 0 14px;
      background: #f5f7fc;
      color: #202533;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 80ms ease, background 120ms ease, border-color 120ms ease;
    }

    button:hover {
      background: #edf0fa;
    }

    button:active {
      transform: scale(0.98);
    }

    button.active {
      border-color: var(--accent);
      background: #e9f1ff;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
    }

    .swatch {
      width: 42px;
      min-width: 42px;
      height: 42px;
      min-height: 42px;
      padding: 0;
      border-radius: 50%;
      border: 3px solid rgba(0, 0, 0, 0.12);
    }

    .swatch.active {
      border-color: #1c2230;
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--accent);
    }

    .swatch[data-color="#ffffff"] {
      border-color: #c5cad6;
    }

    .size-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 210px;
    }

    .size-label {
      font-size: 14px;
      font-weight: 700;
      min-width: 55px;
    }

    #size {
      width: 130px;
      accent-color: var(--accent);
    }

    .size-dot {
      width: 8px;
      height: 8px;
      background: #1f2430;
      border-radius: 50%;
      transform-origin: center;
    }

    .canvas-wrap {
      min-height: 0;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
      background: #fff;
    }

    .hint {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid #d7dbe7;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
      color: #4c5568;
      pointer-events: none;
      transition: opacity 200ms ease;
    }

    .hint.hidden {
      opacity: 0;
    }

    @media (max-width: 720px) {
      .toolbar {
        gap: 8px;
      }

      button {
        min-height: 40px;
        font-size: 14px;
        padding: 0 10px;
      }

      .group {
        border-right: none;
        padding-right: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="toolbar" aria-label="Painting controls">
      <div class="group" id="tools" role="toolbar" aria-label="Tools">
        <button type="button" class="tool active" data-tool="brush" aria-pressed="true">Brush</button>
        <button type="button" class="tool" data-tool="eraser" aria-pressed="false">Eraser</button>
        <button type="button" class="tool" data-tool="fill" aria-pressed="false">Fill</button>
        <button type="button" class="tool" data-tool="line" aria-pressed="false">Line</button>
        <button type="button" class="tool" data-tool="rect" aria-pressed="false">Rect</button>
        <button type="button" class="tool" data-tool="circle" aria-pressed="false">Circle</button>
      </div>

      <div class="group" id="colors" role="toolbar" aria-label="Colors">
        <button class="swatch active" data-color="#ff5b5b" style="background:#ff5b5b" aria-label="Red"></button>
        <button class="swatch" data-color="#ffb400" style="background:#ffb400" aria-label="Orange"></button>
        <button class="swatch" data-color="#ffd93d" style="background:#ffd93d" aria-label="Yellow"></button>
        <button class="swatch" data-color="#57cc99" style="background:#57cc99" aria-label="Green"></button>
        <button class="swatch" data-color="#3f8efc" style="background:#3f8efc" aria-label="Blue"></button>
        <button class="swatch" data-color="#b388ff" style="background:#b388ff" aria-label="Purple"></button>
        <button class="swatch" data-color="#ff8fab" style="background:#ff8fab" aria-label="Pink"></button>
        <button class="swatch" data-color="#a67c52" style="background:#a67c52" aria-label="Brown"></button>
        <button class="swatch" data-color="#9aa3b2" style="background:#9aa3b2" aria-label="Gray"></button>
        <button class="swatch" data-color="#ffffff" style="background:#ffffff" aria-label="White"></button>
        <button class="swatch" data-color="#000000" style="background:#000000" aria-label="Black"></button>
      </div>

      <div class="group">
        <div class="size-wrap">
          <label class="size-label" for="size">Brush</label>
          <input id="size" type="range" min="2" max="50" value="10">
          <span id="sizeDot" class="size-dot" aria-hidden="true"></span>
        </div>
      </div>

      <div class="group">
        <button id="undoBtn" type="button">Undo</button>
        <button id="redoBtn" type="button">Redo</button>
        <button id="clearBtn" type="button">Clear</button>
        <button id="saveBtn" type="button">Save</button>
      </div>
    </section>

    <section class="canvas-wrap">
      <canvas id="paint" aria-label="Drawing canvas"></canvas>
      <p class="hint" id="hint">Use one finger on the trackpad to draw.</p>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("paint");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const sizeInput = document.getElementById("size");
    const sizeDot = document.getElementById("sizeDot");
    const swatches = [...document.querySelectorAll(".swatch")];
    const toolButtons = [...document.querySelectorAll(".tool")];
    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");
    const clearBtn = document.getElementById("clearBtn");
    const saveBtn = document.getElementById("saveBtn");
    const hint = document.getElementById("hint");

    const MAX_HISTORY = 25;
    const FILL_MAX_PIXELS = 2_000_000;

    const state = {
      drawing: false,
      lastX: 0,
      lastY: 0,
      startX: 0,
      startY: 0,
      color: "#ff5b5b",
      brushSize: Number(sizeInput.value),
      tool: "brush",
      undoStack: [],
      redoStack: [],
      shapeSnapshot: null,
      hasDrawn: false
    };

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      const prevW = canvas.width;
      const prevH = canvas.height;
      let backup = null;

      if (prevW && prevH) {
        backup = document.createElement("canvas");
        backup.width = prevW;
        backup.height = prevH;
        backup.getContext("2d").drawImage(canvas, 0, 0);
      }

      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      fillWhite();

      if (backup) {
        ctx.drawImage(backup, 0, 0, rect.width, rect.height);
      }

      applyBrush();
      // History is device-pixel snapshots; clear after resize to avoid size mismatch.
      state.undoStack = [];
      state.redoStack = [];
      updateHistoryButtons();
    }

    function fillWhite() {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

    function strokeColor() {
      return state.tool === "eraser" ? "#ffffff" : state.color;
    }

    function applyBrush() {
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.strokeStyle = strokeColor();
      ctx.fillStyle = strokeColor();
      ctx.lineWidth = state.brushSize;
      sizeDot.style.background = state.tool === "eraser" ? "#9aa3b2" : state.color;
      sizeDot.style.transform = `scale(${Math.max(0.35, state.brushSize / 10)})`;
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    function captureSnapshot() {
      return ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function pushUndo() {
      state.undoStack.push(captureSnapshot());
      if (state.undoStack.length > MAX_HISTORY) {
        state.undoStack.shift();
      }
      state.redoStack = [];
      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      undoBtn.disabled = state.undoStack.length === 0;
      redoBtn.disabled = state.redoStack.length === 0;
    }

    function markDrawn() {
      if (!state.hasDrawn) {
        state.hasDrawn = true;
        hint.classList.add("hidden");
      }
    }

    function setTool(tool) {
      state.tool = tool;
      toolButtons.forEach((btn) => {
        const active = btn.dataset.tool === tool;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-pressed", active ? "true" : "false");
      });
      applyBrush();
    }

    function setColor(color) {
      state.color = color;
      if (state.tool === "eraser") {
        setTool("brush");
      }
      swatches.forEach((item) => {
        item.classList.toggle("active", item.dataset.color === color);
      });
      applyBrush();
    }

    function drawSmoothSegment(x0, y0, x1, y1) {
      const dx = x1 - x0;
      const dy = y1 - y0;
      const dist = Math.hypot(dx, dy);
      const steps = Math.max(1, Math.ceil(dist / 2));

      ctx.beginPath();
      ctx.moveTo(x0, y0);

      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const mx = x0 + dx * t;
        const my = y0 + dy * t;
        ctx.lineTo(mx, my);
      }

      ctx.stroke();
    }

    function drawShapePreview(x0, y0, x1, y1) {
      if (!state.shapeSnapshot) {
        return;
      }
      ctx.putImageData(state.shapeSnapshot, 0, 0);
      applyBrush();
      ctx.beginPath();

      if (state.tool === "line") {
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
      } else if (state.tool === "rect") {
        const w = x1 - x0;
        const h = y1 - y0;
        ctx.strokeRect(x0, y0, w, h);
      } else if (state.tool === "circle") {
        const cx = (x0 + x1) / 2;
        const cy = (y0 + y1) / 2;
        const rx = Math.abs(x1 - x0) / 2;
        const ry = Math.abs(y1 - y0) / 2;
        ctx.ellipse(cx, cy, Math.max(rx, 0.5), Math.max(ry, 0.5), 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function colorsMatch(data, index, r, g, b, a) {
      return (
        data[index] === r &&
        data[index + 1] === g &&
        data[index + 2] === b &&
        data[index + 3] === a
      );
    }

    function floodFill(cssX, cssY) {
      const ratio = window.devicePixelRatio || 1;
      const x = Math.floor(cssX * ratio);
      const y = Math.floor(cssY * ratio);
      if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) {
        return;
      }

      const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const { data, width, height } = image;
      const start = (y * width + x) * 4;
      const tr = data[start];
      const tg = data[start + 1];
      const tb = data[start + 2];
      const ta = data[start + 3];

      // Parse fill color from hex (#rrggbb)
      const hex = state.color.replace("#", "");
      const fr = parseInt(hex.slice(0, 2), 16);
      const fg = parseInt(hex.slice(2, 4), 16);
      const fb = parseInt(hex.slice(4, 6), 16);
      const fa = 255;

      if (tr === fr && tg === fg && tb === fb && ta === fa) {
        return;
      }

      pushUndo();

      const stack = [[x, y]];
      let filled = 0;

      while (stack.length && filled < FILL_MAX_PIXELS) {
        const [cx, cy] = stack.pop();
        if (cx < 0 || cy < 0 || cx >= width || cy >= height) {
          continue;
        }
        const i = (cy * width + cx) * 4;
        if (!colorsMatch(data, i, tr, tg, tb, ta)) {
          continue;
        }

        // Span fill left-right on this row
        let left = cx;
        while (left > 0 && colorsMatch(data, (cy * width + (left - 1)) * 4, tr, tg, tb, ta)) {
          left--;
        }
        let right = cx;
        while (right < width - 1 && colorsMatch(data, (cy * width + (right + 1)) * 4, tr, tg, tb, ta)) {
          right++;
        }

        for (let px = left; px <= right; px++) {
          const pi = (cy * width + px) * 4;
          data[pi] = fr;
          data[pi + 1] = fg;
          data[pi + 2] = fb;
          data[pi + 3] = fa;
          filled++;

          if (cy > 0) {
            const up = ((cy - 1) * width + px) * 4;
            if (colorsMatch(data, up, tr, tg, tb, ta)) {
              stack.push([px, cy - 1]);
            }
          }
          if (cy < height - 1) {
            const down = ((cy + 1) * width + px) * 4;
            if (colorsMatch(data, down, tr, tg, tb, ta)) {
              stack.push([px, cy + 1]);
            }
          }
        }
      }

      ctx.putImageData(image, 0, 0);
      applyBrush();
      markDrawn();
    }

    function startDraw(event) {
      event.preventDefault();
      canvas.setPointerCapture(event.pointerId);
      const { x, y } = canvasPoint(event);

      if (state.tool === "fill") {
        floodFill(x, y);
        return;
      }

      state.drawing = true;
      state.lastX = x;
      state.lastY = y;
      state.startX = x;
      state.startY = y;

      if (state.tool === "brush" || state.tool === "eraser") {
        pushUndo();
        applyBrush();
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y);
        ctx.stroke();
      } else {
        // Shapes: snapshot for live preview; commit undo only if drag completes.
        state.shapeSnapshot = captureSnapshot();
        applyBrush();
      }
    }

    function draw(event) {
      if (!state.drawing) {
        return;
      }
      event.preventDefault();
      const { x, y } = canvasPoint(event);

      if (state.tool === "brush" || state.tool === "eraser") {
        applyBrush();
        drawSmoothSegment(state.lastX, state.lastY, x, y);
        state.lastX = x;
        state.lastY = y;
      } else if (state.tool === "line" || state.tool === "rect" || state.tool === "circle") {
        drawShapePreview(state.startX, state.startY, x, y);
      }
    }

    function stopDraw(event) {
      if (!state.drawing) {
        return;
      }
      event.preventDefault();
      const { x, y } = canvasPoint(event);
      const isShape = state.tool === "line" || state.tool === "rect" || state.tool === "circle";

      if (isShape && state.shapeSnapshot) {
        const moved = Math.hypot(x - state.startX, y - state.startY) > 2;
        finalizeShape(x, y, moved);
      } else if (state.tool === "brush" || state.tool === "eraser") {
        markDrawn();
      }

      state.drawing = false;
      state.shapeSnapshot = null;
      try {
        canvas.releasePointerCapture(event.pointerId);
      } catch (_) {
        // ignore if already released
      }
    }

    function finalizeShape(x, y, moved) {
      if (!state.shapeSnapshot) {
        return;
      }
      // Restore pre-drag image, then either keep it or commit shape.
      ctx.putImageData(state.shapeSnapshot, 0, 0);
      if (!moved) {
        applyBrush();
        return;
      }
      pushUndo();
      applyBrush();
      ctx.beginPath();
      if (state.tool === "line") {
        ctx.moveTo(state.startX, state.startY);
        ctx.lineTo(x, y);
        ctx.stroke();
      } else if (state.tool === "rect") {
        ctx.strokeRect(state.startX, state.startY, x - state.startX, y - state.startY);
      } else if (state.tool === "circle") {
        const cx = (state.startX + x) / 2;
        const cy = (state.startY + y) / 2;
        const rx = Math.max(Math.abs(x - state.startX) / 2, 0.5);
        const ry = Math.max(Math.abs(y - state.startY) / 2, 0.5);
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      markDrawn();
    }

    function cancelDraw(event) {
      if (!state.drawing) {
        return;
      }
      if (state.shapeSnapshot) {
        ctx.putImageData(state.shapeSnapshot, 0, 0);
        applyBrush();
      }
      state.drawing = false;
      state.shapeSnapshot = null;
      try {
        canvas.releasePointerCapture(event.pointerId);
      } catch (_) {
        // ignore
      }
    }

    toolButtons.forEach((btn) => {
      btn.addEventListener("click", () => setTool(btn.dataset.tool));
    });

    swatches.forEach((swatch) => {
      swatch.addEventListener("click", () => setColor(swatch.dataset.color));
    });

    sizeInput.addEventListener("input", () => {
      state.brushSize = Number(sizeInput.value);
      applyBrush();
    });

    undoBtn.addEventListener("click", () => {
      if (!state.undoStack.length) {
        return;
      }
      state.redoStack.push(captureSnapshot());
      if (state.redoStack.length > MAX_HISTORY) {
        state.redoStack.shift();
      }
      const previous = state.undoStack.pop();
      ctx.putImageData(previous, 0, 0);
      applyBrush();
      updateHistoryButtons();
    });

    redoBtn.addEventListener("click", () => {
      if (!state.redoStack.length) {
        return;
      }
      state.undoStack.push(captureSnapshot());
      if (state.undoStack.length > MAX_HISTORY) {
        state.undoStack.shift();
      }
      const next = state.redoStack.pop();
      ctx.putImageData(next, 0, 0);
      applyBrush();
      updateHistoryButtons();
    });

    clearBtn.addEventListener("click", () => {
      pushUndo();
      fillWhite();
      applyBrush();
    });

    saveBtn.addEventListener("click", () => {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const name = `easy-paint-${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}.png`;
      const link = document.createElement("a");
      link.download = name;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    canvas.addEventListener("pointerdown", startDraw);
    canvas.addEventListener("pointermove", draw);
    canvas.addEventListener("pointerup", stopDraw);
    canvas.addEventListener("pointercancel", cancelDraw);
    canvas.addEventListener("pointerleave", (event) => {
      if (state.drawing && (state.tool === "brush" || state.tool === "eraser")) {
        // Keep freehand going if pointer captured; only stop if not captured.
        if (!canvas.hasPointerCapture(event.pointerId)) {
          stopDraw(event);
        }
      }
    });

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    applyBrush();
    updateHistoryButtons();
  </script>
</body>
</html>
